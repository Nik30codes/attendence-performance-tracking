<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Attendance</title>
  <link rel="stylesheet" href="attendancestyle.css">
</head>
<body>

<div class="container">
  <h2>Employee Attendance</h2>

  <form id="attendanceForm">
    <label>Employee ID</label>
    <input type="text" id="empId" required>

    <label>Session ID</label>
    <input type="text" id="sessionId" required>

    <label>Status</label>
    <select id="status" required>
      <option value="">Select</option>
      <option value="PRESENT">PRESENT</option>
      <option value="LATE">LATE</option>
      <option value="ABSENT">ABSENT</option>
    </select>

    <!-- Check-in / Check-out -->
    <div id="timeSection" class="hidden">
      <label>Check In</label>
      <input type="time" id="checkIn">

      <label>Check Out</label>
      <input type="time" id="checkOut">
    </div>

    <!-- Leave Reason -->
    <div id="leaveSection" class="hidden">
      <label>Leave Reason</label>
      <select id="leaveReason">
        <option value="">Select</option>
        <option value="SICK">SICK</option>
        <option value="PERSONAL">PERSONAL</option>
        <option value="OFFICIAL">OFFICIAL</option>
        <option value="UNAPPROVED">UNAPPROVED</option>
      </select>
    </div>

    <button type="submit">Submit Attendance</button>
  </form>

  <p id="message"></p>
</div>

<script src="attendancerecord.js"></script>
</body>
</html>
