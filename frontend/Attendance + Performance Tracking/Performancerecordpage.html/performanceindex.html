<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Performance</title>
  <link rel="stylesheet" href="performancestyle.css">
</head>
<body>

<div class="container">
  <h2>Employee Performance Evaluation</h2>

  <form id="performanceForm">
    <label>Employee ID</label>
    <input type="text" id="userId" required>

    <label>Performance Metric ID</label>
    <input type="text" id="metricId" required>

    <label>Evaluator ID</label>
    <input type="text" id="evaluatorId" required>

    <label>Score</label>
    <input type="number" id="score" min="0" max="100" required>

    <label>Recorded Date</label>
    <input type="date" id="recordedDate" required>

    <button type="submit">Save Performance</button>
  </form>

  <p id="message"></p>
</div>

<script src="performancerecord.js"></script>
</body>
</html>
